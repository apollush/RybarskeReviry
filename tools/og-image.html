<!doctype html>
<html lang="sk"><head><meta charset="utf-8">
<!-- Obrázok na zdieľanie assets/img/og-image.jpg (1200 × 630). Po zmene ho odfoťte v headless Chrome:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1200,630 --virtual-time-budget=5000 --screenshot=og.png tools/og-image.html
     a uložte ako JPG do 300 kB: sips -s format jpeg -s formatOptions 82 og.png --out assets/img/og-image.jpg -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..100,400..800;1,62..100,400..800&display=block">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: "Archivo", sans-serif;
    background: radial-gradient(900px 600px at 85% 40%, #145361 0%, #0B3640 60%); color: #EAF2EF; }
  .lines { position: absolute; inset: 0; opacity: .10; }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: 800; letter-spacing: .01em; }
  .brand img { width: 92px; height: 92px; border-radius: 50%; background: #fff; }
  .brand span span { color: #A9C2BE; }
  h1 { margin: 40px 0 0; font-size: 88px; font-stretch: 64%; font-weight: 800; line-height: .92; letter-spacing: -.005em; color: #fff; }
  h1 .blue { color: #8FA6FF; } h1 .line { display: block; white-space: nowrap; }
  p { margin: 30px 0 0; font-size: 31px; line-height: 1.3; color: #EAF2EF; font-weight: 600; max-width: 22ch; }
  .phone { position: absolute; right: 96px; top: -96px; width: 300px; padding: 9px; border-radius: 46px; background: #0D1B1F;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 40px 80px -30px rgba(0,0,0,.6); transform: rotate(4deg); }
  .phone img { display: block; width: 100%; border-radius: 37px; }
</style></head><body>
<svg class="lines" viewBox="0 0 1200 630" aria-hidden="true"><g fill="none" stroke="#EAF2EF" stroke-width="2">
<path d="M-20 520 C200 470 330 590 560 540 S900 430 1220 500"/><path d="M-20 585 C240 545 380 640 620 600 S960 520 1220 560"/>
<path d="M-20 70 C180 30 360 120 560 80 S900 10 1220 60"/></g></svg>
<div class="copy">
  <div class="brand"><img src="../assets/img/icon-512.png" alt=""><span>Rybárske <span>Revíry SK</span></span></div>
  <h1><span class="line">Všetky zväzové revíry.</span><span class="line blue">Presne na mape.</span></h1>
  <p>349 revírov SRZ s&nbsp;ručne zakreslenými hranicami</p>
</div>
<div class="phone"><img src="../assets/img/screens/mapa-600.jpg" alt=""></div>
</body></html>
